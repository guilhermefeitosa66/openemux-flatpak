name: Build and publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: OpenEmux git ref (tag/branch/commit) to build
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app at the requested ref
        uses: actions/checkout@v4
        with:
          repository: guilhermefeitosa66/OpenEmux
          ref: ${{ inputs.ref }}
          path: openemux

      - name: Check out the published repo (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        # First run: the branch does not exist yet.
        continue-on-error: true

      - name: Prepare gh-pages worktree
        run: |
          mkdir -p site
          if [ ! -d site/.git ]; then
            git -C site init
            git -C site remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
          # Whatever state the checkout left (missing branch on the first
          # run falls back oddly), the local branch must be gh-pages.
          git -C site checkout -B gh-pages
          # git does not track empty directories, so an ostree repo restored
          # from a checkout comes back missing the ones that happen to be
          # empty -- and build-update-repo dies on the first of them
          # ("Listing refs: opendir(refs/remotes)"). Recreate them; the .keep
          # files make them survive the next round trip.
          if [ -d site/repo ]; then
            for dir in refs/heads refs/mirrors refs/remotes objects tmp state; do
              mkdir -p "site/repo/$dir"
              touch "site/repo/$dir/.keep"
            done
          fi

      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder

      - name: Install the GNOME runtime the manifest asks for
        run: |
          MANIFEST=openemux/packaging/flatpak/io.github.guilhermefeitosa66.OpenEmux.yaml
          RUNTIME_VERSION="$(sed -n "s/^runtime-version: '\(.*\)'/\1/p" "$MANIFEST")"
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub \
            "org.gnome.Platform//${RUNTIME_VERSION}" "org.gnome.Sdk//${RUNTIME_VERSION}"

      - name: Embed the ScreenScraper developer credential (when configured)
        env:
          SCREENSCRAPER_DEVID: ${{ secrets.SCREENSCRAPER_DEVID }}
          SCREENSCRAPER_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEVPASSWORD }}
        run: |
          python3 openemux/packaging/embed_screenscraper_credentials.py \
            openemux/src/openemux/core/embedded_credentials.py

      - name: Build into the published ostree repo
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=site/repo build-dir \
            openemux/packaging/flatpak/io.github.guilhermefeitosa66.OpenEmux.yaml
          flatpak build-update-repo --generate-static-deltas site/repo

      - name: Write the flatpakrepo file and index
        run: |
          cat > site/openemux.flatpakrepo <<'EOF'
          [Flatpak Repo]
          Title=OpenEmux
          Url=https://guilhermefeitosa66.github.io/openemux-flatpak/repo
          Homepage=https://github.com/guilhermefeitosa66/OpenEmux
          Comment=Linux-native emulator frontend for RetroArch
          Description=Linux-native emulator frontend for RetroArch
          EOF
          cat > site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>OpenEmux Flatpak repo</title>
          <p>This is the OpenEmux Flatpak repository. See
          <a href="https://github.com/guilhermefeitosa66/openemux-flatpak">the README</a>
          for install instructions.</p>
          EOF
          touch site/.nojekyll

      - name: Publish
        run: |
          cd site
          git config user.name "openemux-flatpak-publish"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "publish: OpenEmux @ ${{ inputs.ref }}"
          git push origin gh-pages
